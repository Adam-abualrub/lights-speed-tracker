<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="index.css">

<body style="background-color: rgb(201, 200, 200);">
    <div class="budgetpage">
        <h1>Budgets</h1>
        <div class="budget-box">
            <div>
                <h3>Current Monthly Budget</h3>
                <h1 class="centertext">$xxxxx</h1>
            </div>
        </div>

        <div class="budget-box">
            <div>
                <h3>Budget cycle ends in:</h3>
                <h1 class="centertext">X days</h1>
            </div>
        </div>

        <div class="budget-box">
            <button class="editbudget">
                Edit Budget
            </button>
        </div>

        <div class="budget-box">
            <div class="spending-categories-box">
                <h3 class="centertext">Spending by Categories</h3>
                <div class="spending-categories">
                    <div class="category-box">
                        <h4 class="centertext">Category1</h4>
                        <h2 class="centertext">$100</h2>
                    </div>
                    <div class="category-box">
                        <h4 class="centertext">Category2</h4>
                        <h2 class="centertext">$100</h2>
                    </div>
                    <div class="category-box">
                        <h4 class="centertext">Category3</h4>
                        <h2 class="centertext">$100</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <p>Homepage</p>
        <p>budget</p>
        <p>budget-box</p>
    </div>
